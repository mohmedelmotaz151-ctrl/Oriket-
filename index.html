<!doctype html>
<html lang="ar" dir="rtl">
<head>

<div id="login" class="login"><div class="login-box"><div class="brand-mark">O</div><h1>أوريكيت</h1><p>نظام إدارة زيارات الدفاع المدني</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" value="admin@oriket.site" required></label><label>كلمة المرور<input id="password" type="password" value="123456" required></label><button class="primary wide">دخول النظام</button></form><div class="demo">نسخة تشغيلية تجريبية • البيانات تحفظ على الجهاز</div></div></div>
