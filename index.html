<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أوريكيت للصيانة</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><div class="login-box"><h1>أوريكيت</h1><p>نظام إدارة الصيانة</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="loginBtn">دخول</button><div id="loginMsg"></div></div></div>
<div id="app" class="hidden"><aside><h1>أوريكيت</h1><small>للصيانة والخدمات</small><nav><button data-page="dashboard">🏠 الرئيسية</button><button data-page="customers">👥 العملاء</button><button data-page="requests">🔧 طلبات الصيانة</button><button data-page="technicians">👨‍🔧 الفنيون</button><button data-page="inventory">📦 قطع الغيار</button><button data-page="invoices">🧾 الفواتير</button><button data-page="reports">📊 التقارير</button></nav><button id="logout">تسجيل الخروج</button></aside><main><header><h2 id="title">الرئيسية</h2><span id="user"></span></header><section id="content"></section></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><button id="close">×</button><div id="modalContent"></div></div></div><script type="module" src="app.js"></script></body></html>
